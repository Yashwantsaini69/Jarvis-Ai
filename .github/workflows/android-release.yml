name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"
          echo "Using SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare update manifest
        run: |
          set -e
          cp "app/build/outputs/apk/release/app-release.apk" Jarvis.apk
          SHA=$(sha256sum Jarvis.apk | awk '{print $1}')
          VERSION_CODE=$(grep -oE "versionCode [0-9]+" app/build.gradle | grep -oE "[0-9]+")
          VERSION_NAME=$(grep -oE "versionName '[^']+'" app/build.gradle | sed "s/versionName '//; s/'//")
          REPO="${{ github.repository }}"
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/${REPO}/releases/latest/download/Jarvis.apk",
            "sha256": "${SHA}",
            "notes": "JARVIS AI ${VERSION_NAME}",
            "force": false,
            "minVersionCode": 0
          }
          EOF
          cat update.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS AI ${{ github.ref_name }}
          files: |
            Jarvis.apk
            update.json
          generate_release_notes: true
