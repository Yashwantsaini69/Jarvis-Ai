name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK" -name sdkmanager -type f | head -1)"
          echo "Using SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare update manifest
        run: |
          set -e
          cp "app/build/outputs/apk/release/app-release.apk" Jarvis.apk
          python3 - <<'PY'
          import hashlib, json, os, re
          sha = hashlib.sha256(open("Jarvis.apk", "rb").read()).hexdigest()
          gradle = open("app/build.gradle", encoding="utf-8").read()
          code = int(re.search(r"versionCode\s+(\d+)", gradle).group(1))
          name = re.search(r"versionName\s+'([^']+)'", gradle).group(1)
          notes = open("release-notes.txt", encoding="utf-8").read().strip()
          repo = os.environ["GITHUB_REPOSITORY"]
          data = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": f"https://github.com/{repo}/releases/latest/download/Jarvis.apk",
              "sha256": sha,
              "notes": notes,
              "force": False,
              "minVersionCode": 0,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(open("update.json", encoding="utf-8").read())
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS AI ${{ github.ref_name }}
          body_path: release-notes.txt
          files: |
            Jarvis.apk
            update.json
